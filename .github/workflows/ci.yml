name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: ./build-app.sh --release

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP="build/Cat Herder.app"
          test -x "$APP/Contents/MacOS/CatHerder"
          test -f "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # The icon is drawn at build time; a silent failure would ship a
          # bundle with no icon at all.
          test -f "$APP/Contents/Resources/AppIcon.icns"
          # The hardened runtime blocks Apple Events without this entitlement,
          # and a blocked event never even prompts — so a build missing it can
          # never switch terminal tabs.
          codesign -d --entitlements - "$APP" 2>&1 \
            | grep -q "com.apple.security.automation.apple-events" \
            || { echo "::error::Apple Events entitlement missing"; exit 1; }

      - name: Package
        run: ditto -c -k --keepParent --sequesterRsrc "build/Cat Herder.app" CatHerder.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CatHerder-${{ github.sha }}
          path: CatHerder.zip
          retention-days: 14
